name: CI

on:
  pull_request:
  push:
    branches: [main]

# Placeholders para que el postinstall (scripts/generate-env.mjs) no falle.
# CI no se conecta al backend real — los tests usan mocks y el build solo valida que compile.
# Los valores reales viven en Vercel env vars (Production/Preview).
env:
  SUPABASE_URL: https://ci.placeholder.supabase.co
  SUPABASE_ANON_KEY: ci_placeholder_anon_key
  SENTRY_DSN: ""

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agenda-beta
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: agenda-beta/package-lock.json
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agenda-beta
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: agenda-beta/package-lock.json
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agenda-beta
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: agenda-beta/package-lock.json
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - run: npm run build
